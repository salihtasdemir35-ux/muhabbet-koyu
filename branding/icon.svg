<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5f8a"/>
      <stop offset="0.28" stop-color="#ff9a52"/>
      <stop offset="0.55" stop-color="#ff7a3d"/>
      <stop offset="0.62" stop-color="#e8503a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.6" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7da0"/>
      <stop offset="1" stop-color="#0a3049"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dfae"/>
      <stop offset="1" stop-color="#d9b77a"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9481a"/>
      <stop offset="1" stop-color="#7a1d06"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="coal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff4a10"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1024" height="1024" rx="224"/></clipPath>
    <clipPath id="above"><rect width="1024" height="610"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- gökyüzü + güneş -->
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="560" cy="610" r="330" fill="url(#glow)"/>
    <g clip-path="url(#above)"><circle cx="560" cy="610" r="185" fill="url(#sun)"/></g>
    <!-- uzak tepeler -->
    <path d="M0 600 C120 560 220 548 330 575 C390 590 430 596 470 606 L0 610Z" fill="#8a3a3a" opacity="0.55"/>
    <path d="M760 606 C820 570 900 556 1024 572 L1024 610 L760 610Z" fill="#7a3040" opacity="0.5"/>
    <!-- deniz -->
    <rect y="606" width="1024" height="418" fill="url(#sea)"/>
    <!-- güneş yansıması -->
    <g fill="#ffd77a">
      <rect x="430" y="622" width="260" height="10" rx="5" opacity="0.95"/>
      <rect x="455" y="650" width="210" height="9" rx="5" opacity="0.85"/>
      <rect x="480" y="678" width="160" height="8" rx="4" opacity="0.75"/>
      <rect x="500" y="706" width="120" height="7" rx="4" opacity="0.6"/>
      <rect x="515" y="733" width="90" height="6" rx="3" opacity="0.5"/>
      <rect x="530" y="760" width="60" height="5" rx="3" opacity="0.4"/>
    </g>
    <!-- dalgalar -->
    <g fill="none" stroke="#bfe9ff" stroke-linecap="round" opacity="0.55" stroke-width="7">
      <path d="M90 690 q30 -16 60 0 t60 0"/>
      <path d="M760 720 q30 -16 60 0 t60 0"/>
      <path d="M200 790 q30 -16 60 0 t60 0"/>
      <path d="M820 820 q30 -16 60 0 t60 0"/>
    </g>
    <!-- iskele -->
    <g fill="#3a1f18" opacity="0.85">
      <rect x="760" y="640" width="264" height="12" rx="3"/>
      <rect x="790" y="650" width="8" height="40"/><rect x="850" y="650" width="8" height="44"/><rect x="910" y="650" width="8" height="48"/><rect x="970" y="650" width="8" height="52"/>
    </g>
    <!-- martılar -->
    <g fill="none" stroke="#3a1f2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 250 q22 -22 44 0 q22 -22 44 0"/>
      <path d="M300 190 q16 -16 32 0 q16 -16 32 0"/>
    </g>

    <!-- olta: soldan şamandıraya -->
    <path d="M-20 520 C120 380 240 330 330 318" fill="none" stroke="#2a1a14" stroke-width="12" stroke-linecap="round"/>
    <path d="M330 318 C360 470 390 600 404 668" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <g transform="translate(404 676)">
      <ellipse cx="0" cy="8" rx="34" ry="8" fill="#9fe3ff" opacity="0.45"/>
      <circle r="17" fill="#ff2d2d"/>
      <path d="M-17 0 a17 17 0 0 1 34 0z" fill="#ffffff"/>
      <rect x="-2" y="-34" width="4" height="18" fill="#222"/>
    </g>

    <!-- kum -->
    <path d="M0 870 C200 830 360 846 520 868 C700 892 860 856 1024 840 L1024 1024 L0 1024Z" fill="url(#sand)"/>

    <!-- mangal -->
    <g filter="url(#shadow)">
      <rect x="642" y="820" width="250" height="40" rx="10" fill="#2b2b2b"/>
      <rect x="652" y="800" width="230" height="26" rx="8" fill="url(#coal)"/>
      <g stroke="#1a1a1a" stroke-width="6">
        <line x1="650" y1="800" x2="884" y2="800"/>
        <line x1="690" y1="860" x2="670" y2="960"/><line x1="844" y1="860" x2="864" y2="960"/>
      </g>
      <!-- şişler -->
      <g>
        <rect x="660" y="782" width="210" height="6" rx="3" fill="#bdbdbd"/>
        <circle cx="690" cy="785" r="15" fill="#7a3a1c"/><circle cx="728" cy="785" r="15" fill="#e2b13c"/><circle cx="766" cy="785" r="15" fill="#7a3a1c"/><circle cx="804" cy="785" r="15" fill="#3f8a2a"/><circle cx="842" cy="785" r="15" fill="#7a3a1c"/>
      </g>
    </g>
    <!-- duman → konuşma balonu (muhabbet!) -->
    <g fill="#ffffff">
      <circle cx="760" cy="740" r="18" opacity="0.55"/>
      <circle cx="776" cy="700" r="24" opacity="0.65"/>
      <circle cx="800" cy="652" r="30" opacity="0.75"/>
    </g>
    <g filter="url(#shadow)">
      <path d="M676 330 h236 a70 70 0 0 1 70 70 v104 a70 70 0 0 1 -70 70 h-96 l-30 52 l-12 -52 h-98 a70 70 0 0 1 -70 -70 v-104 a70 70 0 0 1 70 -70z" fill="#ffffff"/>
      <!-- balonun içinde balık -->
      <g transform="translate(792 452)">
        <path d="M-78 0 C-40 -46 34 -46 62 0 C34 46 -40 46 -78 0Z" fill="#1b7da0"/>
        <path d="M58 0 L98 -30 L90 0 L98 30Z" fill="#1b7da0"/>
        <path d="M-60 6 C-26 30 26 30 52 6" fill="none" stroke="#bfe9ff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-44" cy="-8" r="8" fill="#ffffff"/><circle cx="-44" cy="-8" r="4" fill="#0a2a3a"/>
        <path d="M-10 -34 C0 -54 22 -56 36 -40" fill="#ff8a3d"/>
      </g>
    </g>

    <!-- ince belli çay bardağı (ön planda) -->
    <g transform="translate(250 760)" filter="url(#shadow)">
      <ellipse cx="0" cy="190" rx="132" ry="26" fill="#f4f1ea"/>
      <ellipse cx="0" cy="184" rx="132" ry="24" fill="#ffffff"/>
      <ellipse cx="0" cy="182" rx="70" ry="12" fill="#e9e2d2"/>
      <!-- çay -->
      <path d="M-62 -20 C-66 30 -38 60 -34 92 C-30 120 -52 150 -50 178 L50 178 C52 150 30 120 34 92 C38 60 66 30 62 -20Z" fill="url(#tea)"/>
      <!-- bardak -->
      <path d="M-74 -60 C-80 20 -44 56 -40 92 C-36 126 -60 150 -58 182 L58 182 C60 150 36 126 40 92 C44 56 80 20 74 -60Z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
      <ellipse cx="0" cy="-60" rx="74" ry="12" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
      <ellipse cx="0" cy="-20" rx="62" ry="9" fill="#ef6a2e" opacity="0.9"/>
      <path d="M-56 -40 C-58 0 -40 40 -36 70" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
      <!-- buhar -->
      <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7">
        <path d="M-20 -80 c-20 -30 20 -50 0 -80"/>
        <path d="M22 -86 c-16 -26 16 -42 0 -66"/>
      </g>
      <!-- kaşık -->
      <rect x="70" y="160" width="90" height="10" rx="5" fill="#c9c9c9" transform="rotate(-12 70 160)"/>
    </g>
  </g>
</svg>
